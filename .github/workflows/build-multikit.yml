name: Build MultiKit APK
on:
  push:
    branches: [build/multikit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: MultiKit
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MultiKit-debug-apk
          path: MultiKit/app/build/outputs/apk/debug/*.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete multikit-latest --cleanup-tag -y || true
          gh release create multikit-latest MultiKit/app/build/outputs/apk/debug/app-debug.apk#MultiKit-debug.apk --title "MultiKit debug APK" --notes "Debug build from ${{ github.sha }}" --target ${{ github.sha }}
      - name: Publish APK to apk-output branch
        run: |
          mkdir -p /tmp/out && cp MultiKit/app/build/outputs/apk/debug/*.apk /tmp/out/MultiKit-debug.apk
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan apk-output && git rm -rf . -q && split -b 50m -d /tmp/out/MultiKit-debug.apk MultiKit-debug.apk.part.
          git add MultiKit-debug.apk.part.* && git commit -qm "MultiKit debug APK" && git push -f origin apk-output
