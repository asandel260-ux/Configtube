name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Lucide icons
        run: |
          mkdir -p /tmp/lu && cd /tmp/lu
          npm init -y >/dev/null
          npm install lucide-static
          node "$GITHUB_WORKSPACE/scripts/gen-icons.mjs" /tmp/lu/node_modules/lucide-static/icons "$GITHUB_WORKSPACE/app/src/main/java/com/studyflow/app/Icons.kt"

      - name: Fetch IBM Plex Sans (OFL)
        run: |
          mkdir -p app/src/main/res/font
          for w in Light Regular Medium SemiBold; do
            lower=$(echo "$w" | tr 'A-Z' 'a-z')
            out="app/src/main/res/font/plex_sans_${lower}.ttf"
            for base in \
              "https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans/fonts/complete/ttf" \
              "https://cdn.jsdelivr.net/gh/IBM/plex@master/packages/plex-sans/fonts/complete/ttf"; do
              curl -fsSL --retry 2 "$base/IBMPlexSans-$w.ttf" -o "$out" || true
              [ -f "$out" ] && [ "$(stat -c%s "$out")" -gt 50000 ] && break
            done
            if [ ! -f "$out" ] || [ "$(stat -c%s "$out")" -le 50000 ]; then
              echo "::error title=Font download failed::IBMPlexSans-$w.ttf could not be downloaded"
              exit 1
            fi
          done
          ls -la app/src/main/res/font

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          out = []
          for i, l in enumerate(lines):
              if l.startswith('e: ') or 'What went wrong' in l or l.startswith('Execution failed'):
                  out.extend(lines[i:i+4])
          if not out:
              out = lines[-40:]
          msg = '\n'.join(out[:60]).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Build errors::' + msg)
          PY
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StudyFlow-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f dist/StudyFlow-debug.apk
          git add -f app/src/main/java/com/studyflow/app/Icons.kt
          git add -f app/src/main/res/font
          git commit -m "Add built APK [skip ci]" || exit 0
          git push
