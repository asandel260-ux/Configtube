name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          out = []
          for i, l in enumerate(lines):
              if l.startswith('e: ') or 'What went wrong' in l or l.startswith('Execution failed'):
                  out.extend(lines[i:i+4])
          if not out:
              out = lines[-40:]
          msg = '\n'.join(out[:60]).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Build errors::' + msg)
          PY
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-apk
          path: app/build/outputs/apk/debug/app-debug.apk
